name: CI Tests & Quality Gate

on:
  push:
    branches:
      - 'feature/**'
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  test:
    name: Run Pytest & Exception Handling Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          # These are injected so pydantic-settings doesn't crash when .env is missing
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          NEO4J_DATABASE: neo4j
          VECTOR_INDEX_NAME: test_index
          EMBEDDING_DIMENSION: 384
          EMBEDDING_PROVIDER: deterministic
          OPENROUTER_API_KEY: sk-fake-key-for-ci-testing
          OPENROUTER_MODEL: anthropic/claude-3.5-sonnet
        run: |
          pytest tests/ -v --tb=short